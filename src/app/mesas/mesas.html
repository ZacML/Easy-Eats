<div class="pagina">
  <header class="topo">
    <h1>Mesas</h1>
    <p>Visualize e gerencie o status das mesas do salão</p>
  </header>

  <div class="grid-stats">
    <div class="stat-card">
      <div class="stat-label">Mesas Livres</div>
      <div class="stat-valor">{{ totalLivres }}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Mesas Ocupadas</div>
      <div class="stat-valor">{{ totalOcupadas }}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Mesas Reservadas</div>
      <div class="stat-valor">{{ totalReservadas }}</div>
    </div>
  </div>

  <section class="painel">
    <h3>Mapa de Mesas</h3>

    <div class="grid-mesas">
      @for (mesa of mesas; track mesa.numero) {
        <button type="button" class="cartao-mesa" (click)="cicloStatus(mesa)">
          <i class="bi bi-grid-3x3-gap-fill"></i>
          <span class="numero-mesa">Mesa {{ mesa.numero }}</span>
          <span class="badge" [ngClass]="badgeClasse(mesa.status)">{{ mesa.status }}</span>
        </button>
      } @empty {
        <p class="vazio">Nenhuma mesa cadastrada.</p>
      }
    </div>
  </section>
</div>
