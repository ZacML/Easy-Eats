<div class="pagina">
  <header class="topo">
    <h1>Novo Produto</h1>
    <p>Cadastre um novo item no catálogo</p>
  </header>

  <div class="card-form">
    <form [formGroup]="form" (ngSubmit)="abrirModalConfirmacao()">
      <div class="input-group">
        <label>Nome do Produto</label>
        <input type="text" placeholder="Ex: Hambúrguer Clássico" formControlName="nome" />
      </div>

      <div class="input-row">
        <div class="input-group">
          <label>Categoria</label>
          <input type="text" placeholder="Lanches, Bebidas..." formControlName="categoria" />
        </div>

        <div class="input-group">
          <label>Preço (R$)</label>
          <input type="number" step="0.01" placeholder="0.00" formControlName="preco" />
        </div>
      </div>

      <div class="input-group">
        <label>Quantidade em Estoque</label>
        <input type="number" placeholder="Ex: 50" formControlName="estoque" />
      </div>

      <div class="actions">
        <button type="submit" class="btn-save" [disabled]="form.invalid">
          <span>+</span> Cadastrar Produto
        </button>
      </div>
    </form>
  </div>

  @if (produtoParaConfirmar) {
    <app-modal-cadastro-produto
      [produto]="produtoParaConfirmar"
      (fechar)="fecharModal()"
      (cadastrar)="finalizarCadastro($event)">
    </app-modal-cadastro-produto>
  }
</div>
